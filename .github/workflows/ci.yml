name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard against committed measurement data
        run: |
          if git ls-files | grep -iE '\.(sxm|3ds|dat|ibw|spm|stp|nid|sm4|npy|npz|h5|hdf5|mat)$'; then
            echo "::error::measurement data must not be tracked"; exit 1;
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install ruff
        run: python -m pip install "ruff>=0.15.1"
      - name: Lint
        run: ruff check .
      # `ruff format --check` exits 0 when it finds NO Python file at all (it
      # only writes "warning: No Python files found under the given path(s)" to
      # stderr), so a bare `ruff format --check .` would silently pass on an
      # empty file set - the same vacuous-gate hole the regression suite had.
      # This step therefore asserts the summary line and echoes the file count,
      # which is the only evidence that the formatter looked at anything.
      # The formatter's output is ruff-version sensitive (the `uv format` pass
      # that once half-formatted this tree shipped 0.12.5 style), so the count
      # line doubles as the canary for a ruff version bump.
      - name: Check formatting
        run: |
          status=0
          output="$(ruff format --check . 2>&1)" || status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            echo "::error::ruff format --check failed: the files listed above are not formatted"
            exit 1
          fi
          count="$(printf '%s\n' "$output" | sed -nE 's/^([0-9]+) files? already formatted$/\1/p')"
          if [ -z "$count" ] || [ "$count" -lt 1 ]; then
            echo "::error::ruff format --check checked no file: a gate that passes on an empty file set is vacuous"
            exit 1
          fi
          echo "ruff format --check: $count file(s) already formatted"

  core-import:
    name: core import (no extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install the package without extras
        run: python -m pip install .
      - name: Core package and submodules must import without extras
        run: |
          python -c "import stm_data_processing, stm_data_processing.stm.qpi_jdos, stm_data_processing.dft.wannier90.mlwf_hamiltonian, stm_data_processing.utils.lattice; print('core import OK')"

  full-test:
    name: regression (data-independent subset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dev and ppt extras
        run: python -m pip install ".[dev,ppt]"
      # The maintainer's one-command gate (`pytest -q`) runs all nine checks and
      # needs measurement data that deliberately never leaves this machine. CI
      # runs only the data-independent subset; `-m "not localdata"` reports how
      # many checks it deselected, so the split stays visible.
      - name: Run the data-independent regression subset
        run: pytest -q -m "not localdata"
