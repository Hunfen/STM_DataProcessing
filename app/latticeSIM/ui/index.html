<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2D Reciprocal Lattice Simulator</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --border: #d7dbe0;
    --text: #1c2330;
    --muted: #5c6572;
    --accent: #1c7ed6;
    --error: #c92a2a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 40px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
  }
  .wrap { max-width: 1240px; margin: 0 auto; }
  h1 {
    font-size: 1.6rem;
    margin: 0 0 16px;
    text-align: center;
  }
  .global-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 0 0 16px;
    font-size: 0.95rem;
  }
  .global-controls input[type="checkbox"] {
    width: 16px;
    height: 16px;
    cursor: pointer;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    box-shadow: 0 1px 2px rgba(20, 30, 45, 0.06);
  }

  /* ---- figures (shown above the basis cards) ---- */
  .figures {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin-bottom: 20px;
  }
  .figure {
    flex: 1 1 480px;
    min-width: 320px;
  }
  .figure h2 {
    margin: 0 0 8px;
    font-size: 1.05rem;
    text-align: center;
  }
  .figure canvas {
    display: block;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
  }
  .scalebar-control {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin: 10px 0 4px;
    font-size: 0.9rem;
  }
  .scalebar-control input {
    width: 110px;
    padding: 6px 8px;
    font-size: 0.95rem;
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .scalebar-control button {
    padding: 6px 14px;
    font-size: 0.9rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
  }
  .scalebar-control button:hover { background: #f1f3f5; }

  /* ---- basis cards (one per layer) ---- */
  .layers {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  @media (max-width: 900px) {
    .layers { grid-template-columns: 1fr; }
  }
  .basis-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    box-shadow: 0 1px 2px rgba(20, 30, 45, 0.06);
  }
  .basis-card.dragging { opacity: 0.45; }
  .basis-card.drag-over {
    border-color: var(--accent);
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .basis-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .drag-handle {
    cursor: grab;
    color: var(--muted);
    font-size: 1.15rem;
    user-select: none;
    padding: 0 2px;
  }
  .drag-handle:active { cursor: grabbing; }
  .basis-title {
    font-weight: 600;
    font-size: 1rem;
    flex: 1 1 auto;
  }
  .delete-btn {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--muted);
    width: 28px;
    height: 28px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
  }
  .delete-btn:hover { background: #fff0f0; color: var(--error); border-color: #f3c2c2; }
  .delete-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    background: #fff;
    color: var(--muted);
    border-color: var(--border);
  }
  .header-color {
    width: 34px;
    height: 30px;
    padding: 2px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
    flex: 0 0 auto;
  }
  .header-color:focus { outline: 2px solid var(--accent); outline-offset: 0; }

  .basis-controls {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: flex-end;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .field label {
    font-size: 0.85rem;
    color: var(--muted);
  }
  .field input[type="number"] {
    width: 112px;
    padding: 7px 9px;
    font-size: 0.95rem;
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .field input:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  .matrix {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    width: 130px;
  }
  .matrix input[type="number"] {
    width: 100%;
    min-width: 0;
    padding: 6px 7px;
    font-size: 0.95rem;
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .matrix input[type="number"]:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  .unit { color: var(--muted); font-size: 0.85rem; margin-left: 2px; }
  .field select {
    padding: 7px 9px;
    font-size: 0.95rem;
    font-family: inherit;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    color: var(--text);
    cursor: pointer;
  }
  .field select:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  .field select:disabled,
  .field input:disabled {
    background: #f1f3f5;
    color: var(--muted);
    cursor: not-allowed;
  }
  .opacity-control {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .opacity-control input[type="range"] {
    width: 90px;
    cursor: pointer;
  }
  .opacity-value {
    font-size: 0.85rem;
    color: var(--muted);
    min-width: 32px;
    font-variant-numeric: tabular-nums;
  }

  .layer-message {
    display: none;
    color: var(--error);
    font-size: 0.85rem;
    margin-top: 10px;
    padding: 6px 10px;
    background: #fff0f0;
    border: 1px solid #f3c2c2;
    border-radius: 6px;
  }
  .layer-message.visible { display: block; }
  .layer-readout {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 18px;
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
  }
  .layer-readout b { color: var(--text); font-variant-numeric: tabular-nums; }

  .add-row { margin-top: 16px; }
  #add-basis {
    padding: 9px 18px;
    font-size: 0.95rem;
    font-weight: 600;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    color: var(--accent);
    cursor: pointer;
  }
  #add-basis:hover { background: #f1f7ff; border-color: var(--accent); }

  /* ---- electron diffraction section (LEED / RHEED / Kikuchi) ---- */
  .diffraction-controls {
    margin-bottom: 20px;
  }
  .diffraction-controls h2 {
    margin: 0 0 12px;
    font-size: 1.05rem;
    text-align: center;
  }
  .figure-note {
    text-align: center;
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 8px;
    min-height: 1.2em;
  }

  /* Inline checkbox used by the RHEED panel (Kikuchi toggle). */
  .field .checkbox-line {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 0.9rem;
    font-weight: 400;
    color: var(--text);
    cursor: pointer;
    min-height: 34px;
    margin-top: 1px;
  }
  .checkbox-line input[type="checkbox"] {
    width: 16px;
    height: 16px;
    cursor: pointer;
    accent-color: var(--accent);
  }

  /* ---- tab navigation ---- */
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    margin: 0 0 18px;
  }
  .tab-btn {
    padding: 8px 26px;
    font-size: 1rem;
    font-weight: 600;
    font-family: inherit;
    color: var(--muted);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
  }
  .tab-btn:hover { background: #f1f3f5; color: var(--text); }
  .tab-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>2D Reciprocal Lattice Simulator</h1>

    <!-- Tab bar: lattice + reciprocal / LEED / RHEED (+ merged Kikuchi). -->
    <div class="tabs" role="tablist" aria-label="Simulation views">
      <button type="button" class="tab-btn active" data-tab="lattice" role="tab" aria-selected="true">Lattice &amp; Reciprocal</button>
      <button type="button" class="tab-btn" data-tab="leed" role="tab" aria-selected="false">LEED</button>
      <button type="button" class="tab-btn" data-tab="rheed" role="tab" aria-selected="false">RHEED</button>
    </div>

    <!-- Lattice & reciprocal-space view: real/reciprocal figures plus the
         per-layer basis cards that feed every diffraction tab. -->
    <section class="tab-panel active" id="tab-lattice">
      <div class="global-controls">
        <input type="checkbox" id="fill-lattice" checked />
        <label for="fill-lattice">Fill lattice points across the display area</label>
      </div>

      <div class="figures">
        <div class="figure card">
          <h2>Real space</h2>
          <canvas id="cv-real"></canvas>
          <div class="scalebar-control">
            <label>Scalebar:
              <input type="number" id="sb-real" step="any" min="0" />
              <span class="unit">nm</span>
            </label>
            <button id="reset-real">Reset</button>
          </div>
        </div>

        <div class="figure card">
          <h2>Reciprocal space</h2>
          <canvas id="cv-rec"></canvas>
          <div class="scalebar-control">
            <label>Scalebar:
              <input type="number" id="sb-rec" step="any" min="0" />
              <span class="unit">Å⁻¹</span>
            </label>
            <button id="reset-rec">Reset</button>
          </div>
        </div>
      </div>

      <div class="basis-area">
        <div id="layers" class="layers"></div>
        <div class="add-row">
          <button id="add-basis">Add basis</button>
        </div>
      </div>
    </section>

    <!-- LEED view: normal-incidence spot pattern (energy only). -->
    <section class="tab-panel" id="tab-leed">
      <div class="diffraction-controls card">
        <h2>LEED</h2>
        <div class="row">
          <div class="field">
            <label>Energy E (eV)</label>
            <input type="number" id="df-energy-leed" step="0.1" min="1" value="100" />
          </div>
        </div>
      </div>
      <div class="figure card">
        <h2>LEED pattern</h2>
        <canvas id="cv-leed"></canvas>
        <div class="figure-note" id="df-leed-note"></div>
      </div>
    </section>

    <!-- RHEED view: grazing-incidence spots with the Kikuchi lines
         (computed for the same grazing beam) merged onto one screen. The
         beam geometry follows RHEEDSIM: energy E, grazing angle alpha,
         sample azimuth phi (in-plane beam vs. a1 angle) and the
         sample-to-screen distance; the checkbox gates the Kikuchi overlay. -->
    <section class="tab-panel" id="tab-rheed">
      <div class="diffraction-controls card">
        <h2>RHEED / Kikuchi</h2>
        <div class="row">
          <div class="field">
            <label>Energy E (keV)</label>
            <input type="number" id="df-energy" step="0.1" min="0.1" value="10" />
          </div>
          <div class="field">
            <label>Grazing angle α (°, RHEED / Kikuchi)</label>
            <input type="number" id="df-alpha" step="any" min="0.1" max="89" value="2" />
          </div>
          <div class="field">
            <label>Inner potential V₀ (eV, Kikuchi)</label>
            <input type="number" id="df-v0" step="any" min="0" value="12" />
          </div>
          <div class="field">
            <label>Out-of-plane spacing c (Å, Kikuchi)</label>
            <input type="number" id="df-c" step="any" min="0.1" value="3.135" />
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="df-phi">Azimuth φ (°, beam vs. a₁)</label>
            <input type="number" id="df-phi" step="any" min="-180" max="180" value="0"
              title="Sample azimuth: in-plane angle between the electron beam and the a₁ crystal direction (0° = beam along a₁)." />
          </div>
          <div class="field">
            <label for="df-sd">Screen distance (cm)</label>
            <input type="number" id="df-sd" step="any" min="1" max="200" value="30"
              title="Sample-to-screen distance; the gnomonic projection scales linearly with it (30 cm reference)." />
          </div>
          <div class="field">
            <label class="checkbox-line" for="df-kikuchi">
              <input type="checkbox" id="df-kikuchi" checked />
              <span>Show Kikuchi lines</span>
            </label>
          </div>
        </div>
      </div>
      <div class="figure card">
        <h2>RHEED pattern &amp; Kikuchi lines</h2>
        <canvas id="cv-rheed"></canvas>
        <div class="figure-note" id="df-rheed-note"></div>
      </div>
    </section>
  </div>

<script src="diffraction.js"></script>
<script>
(function () {
  'use strict';

  // ---- constants ----
  var CSS_SIZE = 560;              // square canvas size in CSS px
  var NM_PER_ANGSTROM = 0.1;       // 1 Å = 0.1 nm (real basis stored in nm; reciprocal basis computed in Å⁻¹)
  // Scalebar length as a fraction of canvas width: half of the golden-section conjugate
  // (1/φ)/2 = (√5 − 1)/4 ≈ 0.309.
  var SCALEBAR_FRACTION = (Math.sqrt(5) - 1) / 4;
  // Palette colors cycled by newly added layers.
  var PALETTE = ['#d6336c', '#1c7ed6', '#2b8a3e', '#e8590c', '#7048e8', '#0ca678', '#f08c00'];
  var DEFAULT_COLOR = '#333333';
  var DEFAULT_L1 = 2.46;
  var DEFAULT_L2 = 2.46;
  var DEFAULT_THETA = 120;
  // Default per-layer opacity (0-1, applied via globalAlpha) so overlapping
  // multi-layer lattices stay legible.
  var DEFAULT_OPACITY = 0.6;

  // ---- canvas setup ----
  function makeCanvas(id) {
    var canvas = document.getElementById(id);
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(CSS_SIZE * dpr);
    canvas.height = Math.round(CSS_SIZE * dpr);
    canvas.style.width = CSS_SIZE + 'px';
    canvas.style.height = CSS_SIZE + 'px';
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { canvas: canvas, ctx: ctx };
  }

  var real = makeCanvas('cv-real');
  var rec = makeCanvas('cv-rec');

  var sbReal = document.getElementById('sb-real');
  var sbRec = document.getElementById('sb-rec');
  var btnReal = document.getElementById('reset-real');
  var btnRec = document.getElementById('reset-rec');
  var layersEl = document.getElementById('layers');
  var addBtn = document.getElementById('add-basis');
  var fillLatticeEl = document.getElementById('fill-lattice');

  // ---- state ----
  var layers = [];       // one object per layer; array order = draw order (index 0 = bottom)
  var nextId = 1;
  var paletteIndex = 0;
  var rangeReal = 0;     // full canvas width in nm
  var rangeRec = 0;      // full canvas width in Å⁻¹
  var defaultReal = 0;
  var defaultRec = 0;
  var dragIndex = -1;    // source card index during drag-and-drop
  var fillLattice = true; // global toggle: fill points across the whole area (vs sparse center cluster)

  // ---- small math helpers ----
  function norm(v) { return Math.hypot(v[0], v[1]); }
  function cross2(u, v) { return Math.abs(u[0] * v[1] - u[1] * v[0]); }

  function fmt(x, digits) {
    if (!isFinite(x)) return '';
    return String(Number(x.toPrecision(digits)));
  }

  // Clamp a layer opacity to [0, 1], falling back to the default for
  // non-finite input.
  function clampOpacity(x) {
    if (!isFinite(x)) return DEFAULT_OPACITY;
    return Math.min(1, Math.max(0, x));
  }

  function angleDeg(u, v) {
    var nu = norm(u);
    var nv = norm(v);
    if (nu < 1e-12 || nv < 1e-12) return NaN;
    var c = (u[0] * v[0] + u[1] * v[1]) / (nu * nv);
    c = Math.max(-1, Math.min(1, c));
    return Math.acos(c) * 180 / Math.PI;
  }

  function isIdentity(sc) {
    return sc.s11 === 1 && sc.s12 === 0 && sc.s21 === 0 && sc.s22 === 1;
  }

  // Standard counter-clockwise rotation in math coordinates (y up).
  function rotateVector(v, deg) {
    if (!deg) return [v[0], v[1]];
    var r = deg * Math.PI / 180;
    var c = Math.cos(r);
    var s = Math.sin(r);
    return [c * v[0] - s * v[1], s * v[0] + c * v[1]];
  }

  // ---- physics ----
  function computeBasis(L1, L2, theta) {
    var th = theta * Math.PI / 180;
    var sin = Math.sin(th);
    var cos = Math.cos(th);

    // Real-space basis in nm (a1 along +x).
    var a1 = [L1 * NM_PER_ANGSTROM, 0.0];
    var a2 = [L2 * NM_PER_ANGSTROM * cos, L2 * NM_PER_ANGSTROM * sin];

    // Reciprocal basis in Å⁻¹ (a_i · b_j = 2π δ_ij with a_i in Å).
    var b1 = [2 * Math.PI / L1, -2 * Math.PI * cos / (L1 * sin)];
    var b2 = [0.0, 2 * Math.PI / (L2 * sin)];

    return { a1: a1, a2: a2, b1: b1, b2: b2 };
  }

  // Supercell (effective) lattice: A' = A·S in real space (nm), B' = B·(S⁻¹)ᵀ in reciprocal space (Å⁻¹),
  // where S = [[s11, s12], [s21, s22]] has integer entries.
  function computeSupercell(b, S) {
    var a1 = [S.s11 * b.a1[0] + S.s21 * b.a2[0], S.s11 * b.a1[1] + S.s21 * b.a2[1]];
    var a2 = [S.s12 * b.a1[0] + S.s22 * b.a2[0], S.s12 * b.a1[1] + S.s22 * b.a2[1]];
    var b1 = [
      (S.s22 * b.b1[0] - S.s12 * b.b2[0]) / S.det,
      (S.s22 * b.b1[1] - S.s12 * b.b2[1]) / S.det
    ];
    var b2 = [
      (S.s11 * b.b2[0] - S.s21 * b.b1[0]) / S.det,
      (S.s11 * b.b2[1] - S.s21 * b.b1[1]) / S.det
    ];
    return {
      a1: a1, a2: a2, b1: b1, b2: b2,
      s11: S.s11, s12: S.s12, s21: S.s21, s22: S.s22, det: S.det
    };
  }

  // ---- default ranges (max over layers) ----
  function defaultRangeRealOf(sc) {
    var ext = Math.max(
      norm(sc.a1),
      norm(sc.a2),
      norm([sc.a1[0] + sc.a2[0], sc.a1[1] + sc.a2[1]]),
      norm([sc.a1[0] - sc.a2[0], sc.a1[1] - sc.a2[1]])
    );
    return 4 * ext;
  }

  function defaultRangeRecOf(layer) {
    // Use the effective reciprocal basis B' = B·(S⁻¹)ᵀ so the full supercell
    // reciprocal lattice (h·B₁ + k·B₂) fills the display range, matching the
    // primitive case (S = identity gives B' = B).
    var b1 = layer.supercell.b1;
    var b2 = layer.supercell.b2;
    return (8 / 7) * Math.max(norm(b1), norm(b2));
  }

  function recomputeDefaults() {
    var dr = 0;
    var drec = 0;
    for (var i = 0; i < layers.length; i++) {
      var l = layers[i];
      if (!l.supercell) continue;   // layer has no valid geometry yet
      var r = defaultRangeRealOf(l.supercell);
      if (r > dr) dr = r;
      var rr = defaultRangeRecOf(l);
      if (rr > drec) drec = rr;
    }
    if (dr > 0) defaultReal = dr;
    if (drec > 0) defaultRec = drec;
  }

  // ---- screen mapping ----
  function toScreen(p, range) {
    var cx = CSS_SIZE / 2;
    var cy = CSS_SIZE / 2;
    return [cx + (p[0] / range) * CSS_SIZE, cy - (p[1] / range) * CSS_SIZE];
  }

  // ---- drawing primitives ----
  function clearFigure(ctx) {
    ctx.clearRect(0, 0, CSS_SIZE, CSS_SIZE);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, CSS_SIZE, CSS_SIZE);
  }

  function drawLabel(ctx, x, y, text, color) {
    ctx.save();
    ctx.font = '13px -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#ffffff';
    ctx.strokeText(text, x, y);
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
    ctx.restore();
  }

  function drawArrow(ctx, from, to, color, label) {
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(from[0], from[1]);
    ctx.lineTo(to[0], to[1]);
    ctx.stroke();

    var dx = to[0] - from[0];
    var dy = to[1] - from[1];
    var len = Math.hypot(dx, dy);
    if (len < 1e-9) return;
    var ux = dx / len;
    var uy = dy / len;
    var head = 9;
    var angle = Math.PI / 6;
    var tip = to;
    var bx = tip[0] - ux * head;
    var by = tip[1] - uy * head;
    var px = -uy, py = ux;
    ctx.beginPath();
    ctx.moveTo(tip[0], tip[1]);
    ctx.lineTo(bx + px * head * Math.tan(angle), by + py * head * Math.tan(angle));
    ctx.lineTo(bx - px * head * Math.tan(angle), by - py * head * Math.tan(angle));
    ctx.closePath();
    ctx.fill();

    if (label) {
      drawLabel(ctx, tip[0] + ux * 14, tip[1] + uy * 14, label, color);
    }
  }

  function drawPoints(ctx, u, v, range, color, opacity) {
    var minPerp = cross2(u, v) / Math.max(norm(u), norm(v));
    // Fill the whole display area by default; when the global toggle is off,
    // draw only a small centered cluster so stacked multi-layer lattices stay
    // legible.
    var N = fillLattice ? Math.ceil(range / minPerp) + 2 : 2;
    var margin = 3;
    ctx.save();
    ctx.fillStyle = color;
    // Per-layer semi-transparency so overlapping layers blend instead of hiding.
    ctx.globalAlpha = opacity;
    for (var i = -N; i <= N; i++) {
      for (var j = -N; j <= N; j++) {
        var px = i * u[0] + j * v[0];
        var py = i * u[1] + j * v[1];
        var s = toScreen([px, py], range);
        if (s[0] >= -margin && s[0] <= CSS_SIZE + margin &&
            s[1] >= -margin && s[1] <= CSS_SIZE + margin) {
          ctx.beginPath();
          ctx.arc(s[0], s[1], 3, 0, 2 * Math.PI);
          ctx.fill();
        }
      }
    }
    ctx.restore();
  }

  function drawScalebar(ctx, range, unitLabel, unitScale) {
    var barPx = SCALEBAR_FRACTION * CSS_SIZE;
    var m = 22;
    var y = CSS_SIZE - m;
    var x0 = m;
    var x1 = x0 + barPx;
    var S = range * SCALEBAR_FRACTION * unitScale;

    // Semi-transparent background so the bar and label stay readable over lattice points.
    ctx.save();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
    ctx.fillRect(x0 - 8, y - 24, barPx + 16, 36);
    ctx.restore();

    ctx.strokeStyle = '#000000';
    ctx.fillStyle = '#000000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x0, y);
    ctx.lineTo(x1, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x0, y - 5); ctx.lineTo(x0, y + 5);
    ctx.moveTo(x1, y - 5); ctx.lineTo(x1, y + 5);
    ctx.stroke();

    ctx.font = '12px -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(fmt(S, 3) + ' ' + unitLabel, (x0 + x1) / 2, y - 8);
  }

  // ---- per-layer drawing ----
  function drawRealLayer(layer, R) {
    var sc = layer.supercell;
    if (!sc) return;
    var ctx = real.ctx;
    var color = layer.color;
    var o = toScreen([0, 0], R);
    var pa1 = toScreen(sc.a1, R);
    var pa2 = toScreen(sc.a2, R);
    var pa12 = toScreen([sc.a1[0] + sc.a2[0], sc.a1[1] + sc.a2[1]], R);

    // Effective-cell parallelogram: 0 -> a1 -> a1+a2 -> a2.
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 4]);
    ctx.beginPath();
    ctx.moveTo(o[0], o[1]);
    ctx.lineTo(pa1[0], pa1[1]);
    ctx.lineTo(pa12[0], pa12[1]);
    ctx.lineTo(pa2[0], pa2[1]);
    ctx.closePath();
    ctx.stroke();
    ctx.setLineDash([]);

    drawPoints(ctx, sc.a1, sc.a2, R, color, layer.opacity);
    drawArrow(ctx, o, pa1, color, 'a₁');
    drawArrow(ctx, o, pa2, color, 'a₂');
  }

  function drawRecLayer(layer, R) {
    var sc = layer.supercell;
    if (!sc) return;
    var ctx = rec.ctx;
    var color = layer.color;
    var o = toScreen([0, 0], R);
    var pb1 = toScreen(sc.b1, R);
    var pb2 = toScreen(sc.b2, R);
    var pb12 = toScreen([sc.b1[0] + sc.b2[0], sc.b1[1] + sc.b2[1]], R);

    // Effective reciprocal unit cell: 0 -> b1 -> b1+b2 -> b2, drawn as a dashed
    // outline to match the real-space unit cell.
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 4]);
    ctx.beginPath();
    ctx.moveTo(o[0], o[1]);
    ctx.lineTo(pb1[0], pb1[1]);
    ctx.lineTo(pb12[0], pb12[1]);
    ctx.lineTo(pb2[0], pb2[1]);
    ctx.closePath();
    ctx.stroke();
    ctx.setLineDash([]);

    // Draw the full effective reciprocal lattice (h·B₁ + k·B₂). For the identity
    // matrix the effective basis is the primitive b₁, b₂; otherwise it is the
    // supercell basis B₁, B₂ = B·(S⁻¹)ᵀ.
    drawPoints(ctx, sc.b1, sc.b2, R, color, layer.opacity);
    drawArrow(ctx, o, pb1, color, 'b₁');
    drawArrow(ctx, o, pb2, color, 'b₂');
  }

  function drawRealFigure() {
    clearFigure(real.ctx);
    if (rangeReal <= 0) return;
    for (var i = 0; i < layers.length; i++) drawRealLayer(layers[i], rangeReal);
    drawScalebar(real.ctx, rangeReal, 'nm', 1);
  }

  function drawRecFigure() {
    clearFigure(rec.ctx);
    if (rangeRec <= 0) return;
    for (var i = 0; i < layers.length; i++) drawRecLayer(layers[i], rangeRec);
    drawScalebar(rec.ctx, rangeRec, 'Å⁻¹', 1);
  }

  function drawAll() {
    drawRealFigure();
    drawRecFigure();
    drawDiffractionFigures();
  }

  // ---- layer computation ----
  function recomputeLayer(layer) {
    var errors = [];
    var L1 = layer.L1, L2 = layer.L2, theta = layer.theta;

    if (!isFinite(L1) || L1 <= 0) errors.push('a₁ length must be a positive number.');
    if (!isFinite(L2) || L2 <= 0) errors.push('a₂ length must be a positive number.');
    if (!isFinite(theta) || theta < 1 || theta > 179) {
      errors.push('Angle θ must be between 1° and 179°.');
    } else if (Math.abs(Math.sin(theta * Math.PI / 180)) < 0.01) {
      errors.push('Angle θ is too close to 0° or 180° (degenerate lattice).');
    }

    var svals = [layer.s11, layer.s12, layer.s21, layer.s22];
    var sNames = ['S₁₁', 'S₁₂', 'S₂₁', 'S₂₂'];
    var scValid = true;
    var det = 0;
    for (var k = 0; k < 4; k++) {
      if (!isFinite(svals[k]) || !Number.isInteger(svals[k])) {
        errors.push(sNames[k] + ' must be an integer.');
        scValid = false;
      }
    }
    if (scValid) {
      det = svals[0] * svals[3] - svals[1] * svals[2];
      if (det === 0) errors.push('Supercell matrix must be invertible (determinant ≠ 0).');
    }

    layer.errors = errors;
    if (errors.length) return;   // keep the last valid geometry

    var basis = computeBasis(L1, L2, theta);
    var rot = layer.rotation;
    if (!isFinite(rot)) rot = 0;
    if (rot) {
      basis = {
        a1: rotateVector(basis.a1, rot),
        a2: rotateVector(basis.a2, rot),
        b1: rotateVector(basis.b1, rot),
        b2: rotateVector(basis.b2, rot)
      };
    }
    layer.basis = basis;
    var S = { s11: svals[0], s12: svals[1], s21: svals[2], s22: svals[3], det: det };
    layer.primitive = isIdentity(S);
    layer.supercell = computeSupercell(basis, S);
  }

  function makeLayer(raw) {
    var layer = {
      id: raw.id,
      L1: raw.L1, L2: raw.L2, theta: raw.theta,
      s11: raw.s11, s12: raw.s12, s21: raw.s21, s22: raw.s22,
      rotation: raw.rotation,
      color: raw.color,
      opacity: clampOpacity(raw.opacity),
      symmetry: raw.symmetry || 'oblique',
      basis: null,
      supercell: null,
      primitive: true,
      errors: []
    };
    recomputeLayer(layer);
    return layer;
  }

  // ---- card DOM construction ----
  function numField(labelText, fieldName, value, opts) {
    var wrap = document.createElement('div');
    wrap.className = 'field';
    var label = document.createElement('label');
    label.textContent = labelText;
    var input = document.createElement('input');
    input.type = 'number';
    input.step = 'any';
    input.dataset.field = fieldName;
    input.value = String(value);
    if (opts && opts.min !== undefined) input.min = String(opts.min);
    if (opts && opts.max !== undefined) input.max = String(opts.max);
    wrap.appendChild(label);
    wrap.appendChild(input);
    return wrap;
  }

  function matrixInput(fieldName, value) {
    var input = document.createElement('input');
    input.type = 'number';
    input.step = '1';
    input.dataset.field = fieldName;
    input.value = String(value);
    return input;
  }

  function makeCard(layer, index) {
    var card = document.createElement('div');
    card.className = 'basis-card';
    // The card itself is not draggable: only the six-dot drag handle below
    // may start a reorder drag (sliders, inputs and buttons must not).
    card.dataset.index = String(index);

    var header = document.createElement('div');
    header.className = 'basis-header';
    var handle = document.createElement('span');
    handle.className = 'drag-handle';
    handle.title = 'Drag to reorder';
    handle.draggable = true;         // only this handle starts a card drag
    handle.textContent = '\u283F';   // braille "all dots" glyph
    var title = document.createElement('span');
    title.className = 'basis-title';
    title.textContent = 'Basis ' + (index + 1);
    var color = document.createElement('input');
    color.type = 'color';
    color.className = 'header-color';
    color.dataset.field = 'color';
    color.value = layer.color;
    color.title = 'Layer color';
    var del = document.createElement('button');
    del.className = 'delete-btn';
    del.type = 'button';
    del.title = 'Delete layer';
    del.textContent = '\u00D7';      // ×
    header.appendChild(handle);
    header.appendChild(title);
    header.appendChild(color);
    header.appendChild(del);
    card.appendChild(header);

    var controls = document.createElement('div');
    controls.className = 'basis-controls';

    // Row 1: lattice symmetry + a₁ length, a₂ length, angle.
    var row1 = document.createElement('div');
    row1.className = 'row';

    // Symmetry selector constrains the free lattice parameters below:
    // oblique keeps L1/L2/theta free, rectangular locks theta = 90 deg,
    // square/hexagonal lock theta and force L2 = L1.
    var symField = document.createElement('div');
    symField.className = 'field';
    var symLabel = document.createElement('label');
    symLabel.textContent = 'Lattice symmetry';
    var symSelect = document.createElement('select');
    symSelect.dataset.field = 'symmetry';
    var symOptions = [
      { value: 'oblique', text: 'Oblique' },
      { value: 'rectangular', text: 'Rectangular' },
      { value: 'square', text: 'Square' },
      { value: 'hexagonal', text: 'Hexagonal' }
    ];
    for (var so = 0; so < symOptions.length; so++) {
      var opt = document.createElement('option');
      opt.value = symOptions[so].value;
      opt.textContent = symOptions[so].text;
      if (opt.value === layer.symmetry) opt.selected = true;
      symSelect.appendChild(opt);
    }
    symField.appendChild(symLabel);
    symField.appendChild(symSelect);
    row1.appendChild(symField);
    row1.appendChild(numField('a₁ length (Å)', 'L1', layer.L1, { min: 0 }));
    row1.appendChild(numField('a₂ length (Å)', 'L2', layer.L2, { min: 0 }));
    row1.appendChild(numField('Angle θ (°)', 'theta', layer.theta, { min: 1, max: 179 }));
    controls.appendChild(row1);

    // Row 2: supercell matrix + rotation.
    var row2 = document.createElement('div');
    row2.className = 'row';
    var scField = document.createElement('div');
    scField.className = 'field';
    var scLabel = document.createElement('label');
    scLabel.textContent = 'Supercell matrix (2×2 integer)';
    var matrix = document.createElement('div');
    matrix.className = 'matrix';
    matrix.appendChild(matrixInput('s11', layer.s11));
    matrix.appendChild(matrixInput('s12', layer.s12));
    matrix.appendChild(matrixInput('s21', layer.s21));
    matrix.appendChild(matrixInput('s22', layer.s22));
    scField.appendChild(scLabel);
    scField.appendChild(matrix);
    row2.appendChild(scField);
    row2.appendChild(numField('Rotation (°)', 'rotation', layer.rotation));

    // Opacity slider: per-layer point transparency (0-1, default 0.6).
    var opacityField = document.createElement('div');
    opacityField.className = 'field';
    opacityField.innerHTML =
      '<label>Opacity</label>' +
      '<div class="opacity-control">' +
      '<input type="range" min="0" max="1" step="0.05" data-field="opacity" value="' + layer.opacity + '" />' +
      '<span class="opacity-value">' + layer.opacity.toFixed(2) + '</span>' +
      '</div>';
    row2.appendChild(opacityField);
    controls.appendChild(row2);

    card.appendChild(controls);

    var msg = document.createElement('div');
    msg.className = 'layer-message';
    card.appendChild(msg);

    var readout = document.createElement('div');
    readout.className = 'layer-readout';
    card.appendChild(readout);

    return card;
  }

  // ---- readout + messages ----
  function updateReadout(layer, el) {
    if (!layer.basis || !layer.supercell) {
      el.innerHTML = '';
      return;
    }
    var na1 = norm(layer.basis.a1) / NM_PER_ANGSTROM;   // nm -> Å
    var na2 = norm(layer.basis.a2) / NM_PER_ANGSTROM;
    var nb1 = norm(layer.basis.b1);                     // already in Å⁻¹
    var nb2 = norm(layer.basis.b2);
    var ang = angleDeg(layer.basis.b1, layer.basis.b2);

    var html =
      '<span>|a₁| = <b>' + fmt(na1, 5) + '</b> Å</span>' +
      '<span>|a₂| = <b>' + fmt(na2, 5) + '</b> Å</span>' +
      '<span>|b₁| = <b>' + fmt(nb1, 5) + '</b> Å⁻¹</span>' +
      '<span>|b₂| = <b>' + fmt(nb2, 5) + '</b> Å⁻¹</span>' +
      '<span>∠(b₁,b₂) = <b>' + fmt(ang, 5) + '</b>°</span>';

    if (!layer.primitive) {
      var fb1 = norm(layer.supercell.b1);
      var fb2 = norm(layer.supercell.b2);
      var fang = angleDeg(layer.supercell.b1, layer.supercell.b2);
      html +=
        '<span>|B₁| = <b>' + fmt(fb1, 5) + '</b> Å⁻¹</span>' +
        '<span>|B₂| = <b>' + fmt(fb2, 5) + '</b> Å⁻¹</span>' +
        '<span>∠(B₁,B₂) = <b>' + fmt(fang, 5) + '</b>°</span>' +
        '<span>det(S) = <b>' + layer.supercell.det + '</b></span>';
    }
    el.innerHTML = html;
  }

  // Enforce the lattice symmetry constraint of a layer onto its scalar
  // parameters and mirror the result onto the card's inputs:
  //   oblique     - L1, L2 and theta all free (default).
  //   rectangular - theta locked to 90 deg; L2 free.
  //   square      - theta locked to 90 deg and L2 = L1 (both locked).
  //   hexagonal   - theta locked to 120 deg and L2 = L1 (both locked).
  // Disabled inputs never fire input events, so whenever a free parameter
  // (L1) changes the derived values must be written back here; the values
  // stay preserved when the constraint is later removed (back to oblique).
  function applySymmetryState(layer, card) {
    var l2Input = card.querySelector('[data-field="L2"]');
    var thetaInput = card.querySelector('[data-field="theta"]');
    var lockL2 = (layer.symmetry === 'square' || layer.symmetry === 'hexagonal');
    if (layer.symmetry === 'rectangular' || layer.symmetry === 'square') {
      layer.theta = 90;
    } else if (layer.symmetry === 'hexagonal') {
      layer.theta = 120;
    }
    if (lockL2 && isFinite(layer.L1)) {
      layer.L2 = layer.L1;
    }
    if (thetaInput) {
      thetaInput.disabled = (layer.symmetry !== 'oblique');
      if (thetaInput.disabled) thetaInput.value = String(layer.theta);
    }
    if (l2Input) {
      l2Input.disabled = lockL2;
      if (lockL2 && isFinite(layer.L2)) l2Input.value = String(layer.L2);
    }
  }

  function renderCardState(layer, card) {
    applySymmetryState(layer, card);
    var msg = card.querySelector('.layer-message');
    if (layer.errors.length) {
      msg.textContent = layer.errors.join(' ');
      msg.className = 'layer-message visible';
    } else {
      msg.textContent = '';
      msg.className = 'layer-message';
    }
    updateReadout(layer, card.querySelector('.layer-readout'));

    // Keep the opacity readout in sync with the slider.
    var opacityValue = card.querySelector('.opacity-value');
    if (opacityValue) opacityValue.textContent = layer.opacity.toFixed(2);
  }

  function renderCards() {
    layersEl.innerHTML = '';
    for (var i = 0; i < layers.length; i++) {
      var card = makeCard(layers[i], i);
      layersEl.appendChild(card);
      renderCardState(layers[i], card);
    }
    updateDeleteButtons();
  }

  function updateDeleteButtons() {
    var cards = layersEl.querySelectorAll('.basis-card');
    var disable = (layers.length <= 1);
    for (var i = 0; i < cards.length; i++) {
      cards[i].querySelector('.delete-btn').disabled = disable;
    }
  }

  // ---- layer list mutations ----
  function nextPaletteColor() {
    var c = PALETTE[paletteIndex % PALETTE.length];
    paletteIndex++;
    return c;
  }

  function addLayer() {
    var color = nextPaletteColor();
    var layer = makeLayer({
      id: nextId++,
      L1: DEFAULT_L1, L2: DEFAULT_L2, theta: DEFAULT_THETA,
      s11: 1, s12: 0, s21: 0, s22: 1,
      rotation: 0,
      color: color,
      opacity: DEFAULT_OPACITY
    });
    layers.push(layer);
    var card = makeCard(layer, layers.length - 1);
    layersEl.appendChild(card);
    renderCardState(layer, card);
    updateDeleteButtons();
    recomputeDefaults();
    drawAll();
  }

  function deleteLayer(index) {
    if (layers.length <= 1) return;
    layers.splice(index, 1);
    renderCards();
    recomputeDefaults();
    drawAll();
  }

  function reorderLayers(from, to) {
    if (from === to) return;
    var layer = layers.splice(from, 1)[0];
    layers.splice(to, 0, layer);
    renderCards();
    drawAll();
  }

  // ---- DOM input sync ----
  function readLayerFromDom(layer, card) {
    layer.L1 = parseFloat(card.querySelector('[data-field="L1"]').value);
    layer.L2 = parseFloat(card.querySelector('[data-field="L2"]').value);
    layer.theta = parseFloat(card.querySelector('[data-field="theta"]').value);
    layer.s11 = parseFloat(card.querySelector('[data-field="s11"]').value);
    layer.s12 = parseFloat(card.querySelector('[data-field="s12"]').value);
    layer.s21 = parseFloat(card.querySelector('[data-field="s21"]').value);
    layer.s22 = parseFloat(card.querySelector('[data-field="s22"]').value);
    var rot = parseFloat(card.querySelector('[data-field="rotation"]').value);
    layer.rotation = isFinite(rot) ? rot : 0;
    layer.color = card.querySelector('[data-field="color"]').value;
    layer.opacity = clampOpacity(parseFloat(card.querySelector('[data-field="opacity"]').value));
    var symEl = card.querySelector('[data-field="symmetry"]');
    var sym = symEl ? symEl.value : 'oblique';
    if (sym !== 'oblique' && sym !== 'rectangular' &&
        sym !== 'square' && sym !== 'hexagonal') {
      sym = 'oblique';
    }
    layer.symmetry = sym;
  }

  // ---- scalebar ----
  function syncScalebarInputs() {
    sbReal.value = fmt(rangeReal * SCALEBAR_FRACTION, 3);
    sbRec.value = fmt(rangeRec * SCALEBAR_FRACTION, 3);
  }

  function onScalebarEdit(which, inputEl) {
    var S = parseFloat(inputEl.value);
    if (!isFinite(S) || S <= 0) return;   // ignore invalid; keep last valid range
    if (which === 'real') {
      rangeReal = S / SCALEBAR_FRACTION;
      drawRealFigure();
    } else {
      rangeRec = S / SCALEBAR_FRACTION;   // reciprocal range is in Å⁻¹
      drawRecFigure();
    }
  }

  function onReset(which) {
    if (which === 'real') {
      rangeReal = defaultReal;
      sbReal.value = fmt(rangeReal * SCALEBAR_FRACTION, 3);
      drawRealFigure();
    } else {
      rangeRec = defaultRec;
      sbRec.value = fmt(rangeRec * SCALEBAR_FRACTION, 3);
      drawRecFigure();
    }
  }

  // ---- drag-and-drop reorder ----
  function onDragStart(e) {
    // Only a drag begun on the six-dot handle may reorder a card; any other
    // drag source (opacity slider, number inputs, color picker, delete
    // button, card body) is cancelled so it cannot hijack the drag.
    var handle = e.target && e.target.closest ? e.target.closest('.drag-handle') : null;
    if (!handle) {
      if (e.preventDefault) e.preventDefault();
      return;
    }
    var card = handle.closest('.basis-card');
    if (!card) return;
    dragIndex = Number(card.dataset.index);
    if (e.dataTransfer) {
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', String(dragIndex)); } catch (err) {}
    }
    card.classList.add('dragging');
  }

  function onDragOver(e) {
    var card = e.target && e.target.closest ? e.target.closest('.basis-card') : null;
    if (!card) return;
    e.preventDefault();   // allow drop
    if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
    var idx = Number(card.dataset.index);
    if (idx !== dragIndex) card.classList.add('drag-over');
  }

  function onDragLeave(e) {
    var card = e.target && e.target.closest ? e.target.closest('.basis-card') : null;
    if (!card) return;
    if (!card.contains(e.relatedTarget)) card.classList.remove('drag-over');
  }

  function onDrop(e) {
    var card = e.target && e.target.closest ? e.target.closest('.basis-card') : null;
    if (!card) return;
    e.preventDefault();
    var to = Number(card.dataset.index);
    clearDragCues();
    if (dragIndex >= 0 && to !== dragIndex) {
      reorderLayers(dragIndex, to);
    }
    dragIndex = -1;
  }

  function onDragEnd() {
    clearDragCues();
    dragIndex = -1;
  }

  function clearDragCues() {
    var cards = layersEl.querySelectorAll('.basis-card');
    for (var i = 0; i < cards.length; i++) {
      cards[i].classList.remove('dragging');
      cards[i].classList.remove('drag-over');
    }
  }

  // =====================================================================
  // Electron diffraction figures (LEED / RHEED). Physics comes from
  // ui/diffraction.js (window.Diffraction); numerical equivalence to the
  // Python reference is verified by
  // var/diffraction_js_verify.mjs. LEED has its own tab. The RHEED
  // tab merges the RHEED spot pattern (RHEEDSIM-style angle projection,
  // replacing the former vertical rod streaks) with the Kikuchi lines of
  // the same grazing-incidence beam k_in (energy E, grazing angle alpha)
  // onto one screen. The first
  // basis layer (layers[0]) supplies the geometry: its effective
  // supercell real-space basis is the LEED/RHEED surface lattice (its
  // reciprocal basis is supercell.b1/b2 in Å⁻¹), while the primitive
  // (rotated) basis plus the shared out-of-plane spacing c forms the
  // bulk cell used for the Kikuchi 3D reciprocal lattice.
  // =====================================================================

  var leedFig = makeCanvas('cv-leed');
  var rheedFig = makeCanvas('cv-rheed');

  // LEED and RHEED have independent energies (LEED defaults to 100 eV,
  // RHEED to 10 keV). The LEED panel only has an energy field; the
  // RHEED panel carries its own energy plus the grazing-angle, inner
  // potential and out-of-plane spacing fields below.
  var dfEnergyLeedEl = document.getElementById('df-energy-leed');
  var dfEnergyEl = document.getElementById('df-energy');
  var dfAlphaEl = document.getElementById('df-alpha');
  var dfV0El = document.getElementById('df-v0');
  var dfCEl = document.getElementById('df-c');
  var dfPhiEl = document.getElementById('df-phi');
  var dfScreenDistEl = document.getElementById('df-sd');
  var dfKikuchiEl = document.getElementById('df-kikuchi');
  var leedNoteEl = document.getElementById('df-leed-note');
  var rheedNoteEl = document.getElementById('df-rheed-note');

  // Diffraction settings; defaults mirror the input values above. LEED and
  // RHEED keep independent energies (leedEnergy drives the LEED figure,
  // rheedEnergy drives RHEED and its Kikuchi overlay). The grazing angle
  // drives RHEED and the Kikuchi overlay, and the inner potential and
  // out-of-plane spacing drive only the Kikuchi overlay. The RHEEDSIM-style
  // beam geometry adds the sample azimuth phi (in-plane beam vs. a1 angle)
  // and the sample-to-screen distance; showKikuchi gates the overlay.
  var SCREEN_DIST_CM = 30;      // reference screen distance (cm); scale = D / 30
  var KIKUCHI_INDEX_MAX = 3;    // |h|,|k|,|l| cap of the Kikuchi reciprocal grid
  // RHEEDSIM display window: rod spots are drawn only while their gnomonic
  // azimuth |ky/kx| and elevation kz/kx stay within +/- 1/3 in tan (= tan
  // 18.43 deg), the equivalent of RHEEDSIM's +/- 250 px window at its
  // 750 px/tan projection scale (250/750). Spots farther from the shadow
  // edge fall outside the RHEEDSIM field of view and are skipped.
  var RHEED_TAN_CLIP = 1 / 3;
  var DF = {
    leedEnergy: 100, rheedEnergy: 10, alphaDeg: 2, innerPotential: 12,
    cAxis: 3.135, phiDeg: 0, screenDistCm: SCREEN_DIST_CM, showKikuchi: true
  };

  function setDiffractionNote(el, text) {
    if (el) el.textContent = text || '';
  }

  // The app keeps real-space basis vectors in nm; Diffraction expects Å.
  function toAngstrom(v) {
    return [v[0] / NM_PER_ANGSTROM, v[1] / NM_PER_ANGSTROM];
  }

  // Screen mapping for the Kikuchi overlay kept from the earlier design:
  // its coordinates live in the (e1, e2) frame of the plane perpendicular
  // to k_in, with the axes swapped so that e2 runs along the horizontal
  // canvas axis and e1 along the vertical one. The RHEED spots on the same
  // canvas use the gnomonic tan projection computed inside drawRheedFigure
  // instead (see the note there).
  function rheedToScreen(p, range) {
    return toScreen([p[1], p[0]], range);
  }

  // Clip a screen-space segment to the half-plane above the shadow edge
  // (canvas rows y <= shadowY; the sample blocks everything below the
  // horizon). Returns [x0, y0, x1, y1] of the kept part, or null when the
  // whole segment lies inside the shadow.
  function clipToShadow(x0, y0, x1, y1, shadowY) {
    if (y0 <= shadowY && y1 <= shadowY) return [x0, y0, x1, y1];
    if (y0 > shadowY && y1 > shadowY) return null;
    var t = (shadowY - y0) / (y1 - y0);
    var xc = x0 + t * (x1 - x0);
    if (y0 > shadowY) return [xc, shadowY, x1, y1];
    return [x0, y0, xc, shadowY];
  }

  // Geometry source: the first basis layer, or null while that layer has no
  // valid lattice so the diffraction figures stay blank.
  function diffractionLayer() {
    if (!layers.length) return null;
    var l = layers[0];
    if (!l.basis || !l.supercell || l.errors.length) return null;
    return l;
  }

  // LEED: normal incidence k_in = (0, 0, -k); the screen position of a spot
  // is its reciprocal vector g. Display range = Ewald radius k.
  function drawLeedFigure(layer) {
    var ctx = leedFig.ctx;
    clearFigure(ctx);
    var E = DF.leedEnergy;
    if (!isFinite(E) || E <= 0) {
      setDiffractionNote(leedNoteEl, 'Energy E must be a positive number.');
      return;
    }
    var k = Diffraction.electronWavenumber(E);
    var spots = Diffraction.leedPattern(
      toAngstrom(layer.supercell.a1), toAngstrom(layer.supercell.a2), E
    );
    var range = k;
    for (var i = 0; i < spots.length; i++) {
      var s = spots[i];
      var p = toScreen([s.g_x, s.g_y], range);
      var isSpec = (s.h === 0 && s.k === 0);
      ctx.fillStyle = isSpec ? '#000000' : '#1c7ed6';
      ctx.beginPath();
      ctx.arc(p[0], p[1], isSpec ? 5 : 4, 0, 2 * Math.PI);
      ctx.fill();
      if (isSpec) {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(p[0], p[1], 2, 0, 2 * Math.PI);
        ctx.fill();
        drawLabel(ctx, p[0] + 9, p[1] - 10, '00', '#333333');
      }
    }
    drawScalebar(ctx, range, 'Å⁻¹', 1);
    setDiffractionNote(
      leedNoteEl,
      spots.length + ' spots · E = ' + Number(E).toFixed(1) +
        ' eV · k = ' + fmt(k, 4) + ' Å⁻¹'
    );
  }

  // RHEED: grazing incidence in the xz plane at angle alpha above the
  // surface, k_in = (k cos alpha, 0, -k sin alpha). The RHEED energy field
  // stores keV; the physics module works in eV, so E_eV = E_keV * 1000
  // feeds Diffraction.electronWavenumber and Diffraction.rheedPattern.
  //
  // The RHEED spot pattern uses the RHEEDSIM-style gnomonic ("tan") angle
  // projection. A rod g = h*b1 + k*b2 is a reciprocal-lattice line normal
  // to the surface; elastic scattering fixes k_out = k_in + g_par +
  // k_out_z*z. A rod is drawn as one spot when the Ewald-sphere cut leaves
  // a real, forward-travelling, upward exit beam:
  //
  //   k_out_x = k cos(alpha) + g_x > 0,
  //   k_out_y = g_y,  disc = k^2 - k_out_x^2 - k_out_y^2 > 0,
  //   k_out_z = sqrt(disc).
  //
  // The flat "screen" in front of the crystal records directions through
  // tan of the azimuth/elevation measured from the forward beam axis:
  //
  //   sx = (k_out_y / k_out_x) * S,   sy = (k_out_z / k_out_x) * S
  //
  // with S the scale in px per unit tan. Exit elevation 0 is the surface
  // horizon: it maps to the shadow edge, and the area below it is shaded
  // (the sample blocks rays that would pass under the surface). The
  // specular rod (0,0) leaves at the mirror angle +alpha, so it projects to
  // sy = tan(alpha) * S just above the shadow edge and is drawn large with
  // the label "00". The screen distance D scales S and the Kikuchi overlay
  // linearly (30 cm reference); the sample azimuth phi rotates the crystal
  // about the surface normal before the beam hits it. The Kikuchi overlay
  // keeps its flat-screen (perpendicular to k_in) drawing and is rendered
  // under the spots, translucent and clipped at the shadow edge; it shares
  // the same grazing beam.
  function drawAngularScalebar(ctx, scale) {
    // Angular scalebar for the gnomonic screen: the bar subtends 10 deg of
    // azimuth/elevation, so its pixel length is tan(10 deg) * scale.
    var deg = 10;
    var barPx = Math.tan(deg * Math.PI / 180) * scale;
    var m = 22;
    var y = CSS_SIZE - m;
    var x0 = m;
    var x1 = x0 + barPx;

    // Semi-transparent background so the bar and label stay readable over
    // the shaded shadow region at the bottom of the figure.
    ctx.save();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
    ctx.fillRect(x0 - 8, y - 24, barPx + 16, 36);
    ctx.restore();

    ctx.strokeStyle = '#000000';
    ctx.fillStyle = '#000000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x0, y);
    ctx.lineTo(x1, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x0, y - 5); ctx.lineTo(x0, y + 5);
    ctx.moveTo(x1, y - 5); ctx.lineTo(x1, y + 5);
    ctx.stroke();

    ctx.font = '12px -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(deg + '°', (x0 + x1) / 2, y - 8);
  }

  function drawRheedFigure(layer) {
    var ctx = rheedFig.ctx;
    clearFigure(ctx);
    var E = DF.rheedEnergy;      // keV
    var alphaDeg = DF.alphaDeg;
    var v0 = DF.innerPotential;
    var c = DF.cAxis;
    var phiDeg = DF.phiDeg;          // sample azimuth φ (°, beam vs. a₁)
    var screenCm = DF.screenDistCm;  // sample-to-screen distance (cm)
    var showKikuchi = DF.showKikuchi;
    if (!isFinite(E) || E <= 0 || !isFinite(alphaDeg) ||
        alphaDeg <= 0 || alphaDeg >= 90 || !isFinite(phiDeg) ||
        !isFinite(screenCm) || screenCm <= 0) {
      setDiffractionNote(
        rheedNoteEl,
        'Energy E (keV), grazing angle α (0°-90°), azimuth φ (°) and ' +
        'screen distance (cm, > 0) must be valid.'
      );
      window.__rheedView = null;
      return;
    }
    var EeV = E * 1000;  // keV -> eV for the physics module
    var k = Diffraction.electronWavenumber(EeV);
    var alpha = alphaDeg * Math.PI / 180;
    var kIn = [k * Math.cos(alpha), 0, -k * Math.sin(alpha)];
    var screenMag = screenCm / SCREEN_DIST_CM; // gnomonic scale factor
    // Screen geometry shared by the Kikuchi overlay (line clipping) and the
    // spot projection below: the shadow edge (surface horizon) is the canvas
    // row shadowY, everything below it is shaded as the sample shadow.
    var half = CSS_SIZE / 2;
    var shadowY = Math.round(CSS_SIZE * 0.75);

    // Kikuchi overlay: bulk cell = primitive in-plane basis (rotated by the
    // sample azimuth) + out-of-plane spacing c, hit by the same grazing beam
    // k_in. Skipped when the toggle is off or the Kikuchi inputs are invalid
    // (the RHEED spots are still drawn). The reciprocal grid is capped at
    // KIKUCHI_INDEX_MAX so only the low-index planes are drawn: with no
    // structure factors to fade high-index lines, the full default grid
    // would drown the spot pattern.
    var overlayOk =
      showKikuchi && isFinite(v0) && v0 >= 0 && isFinite(c) && c > 0;
    var lines = [];
    var kEff = 0;
    if (overlayOk) {
      var a1 = rotateVector(toAngstrom(layer.basis.a1), phiDeg);
      var a2 = rotateVector(toAngstrom(layer.basis.a2), phiDeg);
      var rec3d = Diffraction.reciprocal3d(
        [a1[0], a1[1], 0], [a2[0], a2[1], 0], [0, 0, c]
      );
      var kik = Diffraction.kikuchiLines(
        rec3d.b1, rec3d.b2, rec3d.b3, kIn, v0, KIKUCHI_INDEX_MAX
      );
      lines = kik.lines;
      kEff = kik.k_eff;
    }
    // The overlay is drawn on its flat screen perpendicular to k_in with the
    // scale normalised by k_eff; the screen-distance factor magnifies it
    // exactly like the gnomonic spot projection (dividing the normalisation
    // is equivalent to scaling the line coordinates by screenMag).
    var range = overlayOk ? kEff / screenMag : k;

    // Kikuchi underlay: excess lines solid through the g_proj endpoint,
    // deficient lines dashed through the screen center (the origin). The
    // lines are thin and their opacity falls off with the reciprocal length
    // |g| (proxy for the falling structure factors), so the low-index planes
    // stay prominent while the higher-index web does not drown the spot
    // pattern. Every segment is clipped at the shadow edge: below the
    // surface horizon the sample blocks the screen, so no line may bleed
    // into the shadow.
    var drawnPairs = 0;
    if (overlayOk) {
      var extent = 2.6 * range; // long enough to cross the whole display square
      var gMin = Infinity;
      for (var gi = 0; gi < lines.length; gi++) {
        var g3 = lines[gi].g_3d;
        var gNorm = Math.hypot(g3[0], g3[1], g3[2]);
        if (gNorm < gMin) gMin = gNorm;
      }
      ctx.save();
      ctx.lineWidth = 1;
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        var g3b = line.g_3d;
        var fade = Math.min(1, Math.pow(gMin / Math.hypot(g3b[0], g3b[1], g3b[2]), 1.5));
        var lineAlpha = (line.type === 'excess' ? 0.5 : 0.42) * fade;
        if (lineAlpha < 0.06) continue;   // far too faint to contribute
        var n = line.normal_2d;
        var d = [-n[1], n[0]];   // in-screen direction of the line
        var a = line.point_2d;
        var x0 = rheedToScreen([a[0] - d[0] * extent, a[1] - d[1] * extent], range);
        var x1 = rheedToScreen([a[0] + d[0] * extent, a[1] + d[1] * extent], range);
        var seg = clipToShadow(x0[0], x0[1], x1[0], x1[1], shadowY);
        if (!seg) continue;      // whole line lies in the sample shadow
        if (line.type === 'excess') {
          drawnPairs++;
          ctx.strokeStyle = '#4dabf7';
          ctx.setLineDash([]);
        } else {
          ctx.strokeStyle = '#f08c00';
          ctx.setLineDash([5, 4]);
        }
        ctx.globalAlpha = lineAlpha;
        ctx.beginPath();
        ctx.moveTo(seg[0], seg[1]);
        ctx.lineTo(seg[2], seg[3]);
        ctx.stroke();
      }
      ctx.restore();
      ctx.setLineDash([]);
      drawLineLegend(ctx, 18, 22, 'excess', '#4dabf7', []);
      drawLineLegend(ctx, 18, 40, 'deficient', '#f08c00', [5, 4]);
    }

    // Screen geometry of the gnomonic projection. The shadow edge (surface
    // horizon, elevation 0) sits at canvas row shadowY; the scale S is a
    // fixed fraction of the canvas width in px per unit tan, multiplied by
    // the sample-to-screen distance factor (1 at the reference 30 cm), and
    // reduced only when a large grazing angle would push the specular spot
    // (tan alpha) out of the display area.
    var scale = CSS_SIZE * 1.4 * screenMag;
    var specTan = Math.tan(alpha);
    if (specTan * scale > shadowY - 30) scale = (shadowY - 30) / specTan;

    // RHEED spots: keep only the upward, forward beams of the rod cuts and
    // project each one with the tan mapping above. The surface lattice is
    // rotated by the sample azimuth phi (rotation of the crystal about the
    // surface normal relative to the beam), so phi = 0 keeps the beam along
    // the a1 azimuth of the layer.
    var sa1 = rotateVector(toAngstrom(layer.supercell.a1), phiDeg);
    var sa2 = rotateVector(toAngstrom(layer.supercell.a2), phiDeg);
    var streaks = Diffraction.rheedPattern(sa1, sa2, EeV, alphaDeg);
    var k2 = k * k;
    var spots = [];
    for (var s = 0; s < streaks.length; s++) {
      var st = streaks[s];
      var kOut = st.k_out;
      if (kOut[2] <= 0) continue;              // upward exit only
      var kx = kOut[0];
      var ky = kOut[1];
      var disc = k2 - kx * kx - ky * ky;
      if (kx <= 0 || disc <= 0) continue;      // forward beam, real Ewald cut
      var kz = Math.sqrt(disc);
      var rx = ky / kx;                        // gnomonic azimuth (tan)
      var ry = kz / kx;                        // gnomonic elevation (tan)
      // RHEEDSIM display window: drop every rod whose azimuth or elevation
      // tan exceeds +/- 1/3 (approx +/- 18.4 deg), like the +/- 250 px clip
      // of RHEEDSIM's 750 px/tan projection. The specular (00) spot has
      // ry = tan(alpha), so it is unaffected for grazing angles up to
      // 18.4 deg; upward-only exits keep ry > 0.
      if (Math.abs(rx) > RHEED_TAN_CLIP || ry > RHEED_TAN_CLIP) continue;
      var isSpec = (st.h === 0 && st.k === 0);
      spots.push({
        h: st.h, k: st.k,
        kx: kx, ky: ky, kz: kz, disc: disc,
        rx: rx, ry: ry,
        x: half + rx * scale,
        y: shadowY - ry * scale,
        specular: isSpec
      });
    }

    // Shadow region under the shadow edge (rays below the horizon are
    // blocked by the sample): an opaque near-black fill like RHEEDSIM's
    // solid black shadow, plus a bold edge line marking the shadow edge,
    // then the spots above it.
    ctx.fillStyle = '#0b0f14';
    ctx.fillRect(0, shadowY, CSS_SIZE, CSS_SIZE - shadowY);
    ctx.strokeStyle = '#233040';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(0, shadowY);
    ctx.lineTo(CSS_SIZE, shadowY);
    ctx.stroke();

    ctx.save();
    for (var i = 0; i < spots.length; i++) {
      var sp = spots[i];
      if (sp.x < -8 || sp.x > CSS_SIZE + 8 ||
          sp.y < -8 || sp.y > CSS_SIZE + 8) continue;
      if (sp.specular) {
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, 6, 0, 2 * Math.PI);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, 2.5, 0, 2 * Math.PI);
        ctx.fill();
        drawLabel(ctx, sp.x + 9, sp.y - 12, '00', '#333333');
      } else {
        // White halo keeps the small spots distinct from the Kikuchi lines
        // that cross behind them.
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, 4.5, 0, 2 * Math.PI);
        ctx.fill();
        ctx.fillStyle = '#1c7ed6';
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, 3, 0, 2 * Math.PI);
        ctx.fill();
      }
    }
    ctx.restore();
    drawAngularScalebar(ctx, scale);
    var note =
      spots.length + ' spots · α = ' + Number(alphaDeg).toFixed(1) +
      '° · φ = ' + Number(phiDeg).toFixed(1) +
      '° · E = ' + Number(E).toFixed(1) + ' keV';
    if (overlayOk) {
      note += ' · ' + drawnPairs + ' line pairs · V₀ = ' +
        fmt(v0, 3) + ' eV';
    } else if (showKikuchi) {
      note += ' (Kikuchi overlay needs V₀ ≥ 0 and c > 0)';
    } else {
      note += ' (Kikuchi off)';
    }
    setDiffractionNote(rheedNoteEl, note);

    // Expose the last projection state for the headless smoke tests in
    // var/latticesim_rheed_smoke.mjs (drawing-call-independent
    // assertions on the spot geometry).
    window.__rheedView = {
      energyKeV: E, alphaDeg: alphaDeg, phiDeg: phiDeg,
      screenDistCm: screenCm, showKikuchi: showKikuchi, k: k,
      scale: scale, shadowY: shadowY, spots: spots
    };
  }

  function drawLineLegend(ctx, x, y, label, color, dash) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.setLineDash(dash);
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + 24, y);
    ctx.stroke();
    ctx.restore();
    drawLabel(ctx, x + 30, y, label, '#333333');
  }

  function drawDiffractionFigures() {
    var layer = diffractionLayer();
    if (!layer) {
      clearFigure(leedFig.ctx);
      clearFigure(rheedFig.ctx);
      setDiffractionNote(leedNoteEl, 'Basis 1 has no valid lattice geometry.');
      setDiffractionNote(rheedNoteEl, '');
      window.__rheedView = null;
      return;
    }
    drawLeedFigure(layer);
    drawRheedFigure(layer);
  }

  function readDiffractionControls() {
    DF.leedEnergy = parseFloat(dfEnergyLeedEl.value);
    DF.rheedEnergy = parseFloat(dfEnergyEl.value);
    DF.alphaDeg = parseFloat(dfAlphaEl.value);
    DF.innerPotential = parseFloat(dfV0El.value);
    DF.cAxis = parseFloat(dfCEl.value);
    DF.phiDeg = parseFloat(dfPhiEl.value);
    DF.screenDistCm = parseFloat(dfScreenDistEl.value);
    DF.showKikuchi = dfKikuchiEl.checked;
  }

  function onDiffractionControl() {
    readDiffractionControls();
    drawDiffractionFigures();
  }

  // LEED energy is edited on the LEED panel only: update the figures
  // without touching the RHEED energy.
  function onLeedEnergyInput() {
    DF.leedEnergy = parseFloat(dfEnergyLeedEl.value);
    drawDiffractionFigures();
  }

  dfEnergyLeedEl.addEventListener('input', onLeedEnergyInput);
  dfEnergyEl.addEventListener('input', onDiffractionControl);
  dfAlphaEl.addEventListener('input', onDiffractionControl);
  dfV0El.addEventListener('input', onDiffractionControl);
  dfCEl.addEventListener('input', onDiffractionControl);
  dfPhiEl.addEventListener('input', onDiffractionControl);
  dfScreenDistEl.addEventListener('input', onDiffractionControl);
  dfKikuchiEl.addEventListener('change', onDiffractionControl);

  // ---- tab switching (lattice / LEED / RHEED) ----
  var tabBtns = document.querySelectorAll('.tab-btn');
  var tabPanels = document.querySelectorAll('.tab-panel');

  function selectTab(name) {
    for (var i = 0; i < tabBtns.length; i++) {
      var on = tabBtns[i].dataset.tab === name;
      tabBtns[i].classList.toggle('active', on);
      tabBtns[i].setAttribute('aria-selected', on ? 'true' : 'false');
    }
    for (var j = 0; j < tabPanels.length; j++) {
      tabPanels[j].classList.toggle('active', tabPanels[j].id === 'tab-' + name);
    }
    // LEED and RHEED energies are independent (each panel input keeps its
    // own value), so nothing is mirrored when a panel is revealed.
  }

  for (var b = 0; b < tabBtns.length; b++) {
    (function (btn) {
      btn.addEventListener('click', function () {
        selectTab(btn.dataset.tab);
      });
    })(tabBtns[b]);
  }

  // ---- event wiring ----
  layersEl.addEventListener('input', function (e) {
    var t = e.target;
    var card = t && t.closest ? t.closest('.basis-card') : null;
    if (!card) return;
    var index = Number(card.dataset.index);
    var layer = layers[index];
    var fieldName = t.dataset.field;
    readLayerFromDom(layer, card);
    // Apply the symmetry constraint to the freshly read values (theta, and
    // L2 under square/hexagonal, are derived from L1 there) so the
    // recompute and every figure use the constrained geometry.
    applySymmetryState(layer, card);
    recomputeLayer(layer);
    renderCardState(layer, card);

    var isColor = (fieldName === 'color');
    var isRotation = (fieldName === 'rotation');
    var isOpacity = (fieldName === 'opacity');
    // Basis inputs update the default range used by the Reset buttons, but the
    // current scalebar/range is preserved: the default is applied only once on
    // page load, not re-applied on every basis change. Color, rotation and
    // opacity do not affect the default range.
    if (!isColor && !isRotation && !isOpacity && layer.errors.length === 0) {
      recomputeDefaults();
    }
    drawAll();
  });

  layersEl.addEventListener('click', function (e) {
    var btn = e.target && e.target.closest ? e.target.closest('.delete-btn') : null;
    if (!btn) return;
    var card = btn.closest('.basis-card');
    if (!card) return;
    deleteLayer(Number(card.dataset.index));
  });

  layersEl.addEventListener('dragstart', onDragStart);
  layersEl.addEventListener('dragover', onDragOver);
  layersEl.addEventListener('dragleave', onDragLeave);
  layersEl.addEventListener('drop', onDrop);
  layersEl.addEventListener('dragend', onDragEnd);

  addBtn.addEventListener('click', addLayer);

  fillLatticeEl.addEventListener('change', function () {
    fillLattice = fillLatticeEl.checked;
    drawAll();
  });

  sbReal.addEventListener('input', function () { onScalebarEdit('real', sbReal); });
  sbRec.addEventListener('input', function () { onScalebarEdit('rec', sbRec); });
  btnReal.addEventListener('click', function () { onReset('real'); });
  btnRec.addEventListener('click', function () { onReset('rec'); });

  // ---- initial render ----
  function init() {
    var first = makeLayer({
      id: nextId++,
      L1: DEFAULT_L1, L2: DEFAULT_L2, theta: DEFAULT_THETA,
      s11: 1, s12: 0, s21: 0, s22: 1,
      rotation: 0,
      color: DEFAULT_COLOR,
      opacity: DEFAULT_OPACITY
    });
    layers.push(first);
    renderCards();
    recomputeDefaults();
    rangeReal = defaultReal;
    rangeRec = defaultRec;
    syncScalebarInputs();
    drawAll();
  }

  init();
})();
</script>
</body>
</html>
