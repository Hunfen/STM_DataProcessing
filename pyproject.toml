[project]
name = "stm-data-processing"
version = "0.3.0"
description = "STM / DFT / Wannier90 data processing toolkit"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "hunfen", email = "hunfen@anywhere.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=2.3.0",
    "scipy>=1.16.0",
    "matplotlib>=3.10.0",
    "h5py>=3.15.0",
    "pandas>=2.3.0",
    "tqdm>=4.67.0",
    "mpi4py>=4.1.1",
    "ipykernel>=7.2.0",
    "mpmath>=1.4.0",
    "psutil>=7.2.2",
    "pyfftw>=0.15.1",
    "access2thematrix>=0.4.4",
    "python-pptx>=1.0.2",
    "matplotlib-scalebar>=0.9.0",
    "sympy>=1.12",
    "nanonispy>=1.1.0",
    "ipywidgets>=8.1.8",
    "h5netcdf>=1.8.1",
]

[project.optional-dependencies]
# Heavy, feature-specific stacks kept out of the core install: the core
# package (and `import stm_data_processing`) works without them.
analysis = [
    "pymc>=6.1.0",
    "pytensor>=3.1.3",
    "ramanspy>=0.2.10",
]
ppt = ["opencv-python>=4.13.0.92"]
gpu = ["cupy-cuda13x>=14.0.0",]
dev = [
    "ruff>=0.15.1",
    "pytest>=9.1.1",
    "ipykernel>=7.2.0",
]

[project.urls]
Repository = "https://github.com/Hunfen/STM_DataProcessing.git"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["stm_data_processing*"]
exclude = ["tests*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A gate that cannot fail is worse than no gate: if the `check_*.py` glob ever
# matches nothing (tests/ renamed, emptied or moved), the suite must ERROR at
# collection instead of reporting "1 skipped" and exiting 0.  pytest 9 spells
# this `fail_at_collect` (its only failing value; a bare "fail" is rejected
# with exit code 4).
empty_parameter_set_mark = "fail_at_collect"
markers = [
    "localdata: regression check needs measurement data that only exists on the maintainer's workstation; deselected in CI",
]

[tool.ruff]
target-version = "py312"
line-length = 88
# skills/ holds self-contained agent skills that are shipped on their own; they
# are intentionally outside this project's lint scope (69 pre-existing findings
# on master, none of them in this package).
extend-exclude = ["skills"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle error
    "W",   # pycodestyle warning  
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "YTT", # flake8-2020
    "Q",   # flake8-quotes
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "RUF", # Ruff
]
ignore = [
    "E501"
    ]
per-file-ignores = {"__init__.py" = ["F401"]}
allowed-confusables = ["×"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
